name: Build App

on:
  push:
    branches: [master]

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: mac-dmg
          path: out/make/**/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: npm run make
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          path: out/make/**/*.exe